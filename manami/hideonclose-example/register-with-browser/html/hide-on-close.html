<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hide On Close Example</title>
		<link rel="icon" type="image/x-icon" href="../favicon.ico" />
		<link rel="stylesheet" href="../common/style/app.css" />
	</head>

	<body class="col fill gap20">
		<header class="row spread middle">
			<div class="col">
				<h1>Hide On Close</h1>
			</div>
		</header>
		<main class="col fill gap10">
			<p>
				This window is configured with <code>hideOnClose: true</code>. Closing it hides the window
				instead of destroying it.
			</p>
		</main>
	</body>
</html>
