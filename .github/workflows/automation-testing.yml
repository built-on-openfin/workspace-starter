name: Automation Test Headless
on: workflow_dispatch

concurrency:
  group: automation-single-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@openfin'

      - name: Restore root node_modules from cache
        id: node-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci

      - name: Run tests with here-automation
        run: |
          npm run kill --prefix how-to/automation-testing/default
          npm run test --prefix how-to/automation-testing/default
