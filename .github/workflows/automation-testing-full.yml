name: Automation Test Full Headless
on: workflow_dispatch

concurrency:
  group: automation-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@openfin'

      - name: Restore root node_modules from cache
        id: node-cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci

      - name: Run tests with here-automation
        run: |
          npm run kill --prefix how-to/automation-testing/default
          npm run test --prefix how-to/automation-testing/default
        continue-on-error: true

      - name: Run tests with WebdriverIO
        run: |
          npm run kill --prefix how-to/automation-testing/wdio
          npm run test --prefix how-to/automation-testing/wdio
        continue-on-error: true
